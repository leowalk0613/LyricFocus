name: Sync Repo to Gitee

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "要同步到 Gitee 的 GitHub Release 标签（如 v1.9.3；空则同步 Latest）"
        required: false
        default: ""
      push_os3_branch:
        description: "是否同时推送 hyperos3 分支到 Gitee"
        required: false
        default: "true"

jobs:
  mirror-repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Fetch all branches and tags
        run: |
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --tags --force
      - name: Push main + tags (+ optional OS3 branch) to Gitee
        run: |
          git remote add gitee "https://leowalk0613:${{ secrets.GITEE_TOKEN }}@gitee.com/leowalk0613/LyricFocus.git"
          git push gitee HEAD:main --force

          # 仅推送本次相关 tag，避免把本地/历史残留标签整包刷到 Gitee
          # 优先推送本次 release_tag；workflow_dispatch 未指定时仍推 GitHub 上已有 tags（与远端对齐）
          RELEASE_TAG="${{ github.event.inputs.release_tag }}"
          if [ -n "$RELEASE_TAG" ]; then
            curl -s -X DELETE \
              "https://gitee.com/api/v5/repos/leowalk0613/LyricFocus/tags/${RELEASE_TAG}?access_token=${{ secrets.GITEE_TOKEN }}" \
              >/dev/null || true
            git push gitee "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}" --force
          else
            # 与 GitHub 对齐：先列 GitHub tags，逐个推（仍可能覆盖 Gitee 同名 tag）
            for tag in $(git tag -l 'v*'); do
              curl -s -X DELETE \
                "https://gitee.com/api/v5/repos/leowalk0613/LyricFocus/tags/${tag}?access_token=${{ secrets.GITEE_TOKEN }}" \
                >/dev/null || true
              git push gitee "refs/tags/${tag}:refs/tags/${tag}" --force || true
            done
          fi

          if [ "${{ github.event.inputs.push_os3_branch || 'true' }}" = "true" ]; then
            if git rev-parse --verify origin/hyperos3 >/dev/null 2>&1; then
              git push gitee origin/hyperos3:refs/heads/hyperos3 --force
              echo "Pushed hyperos3"
            else
              echo "origin/hyperos3 not found, skip"
            fi
            # 清理旧分支名 hyperos3-1.9.1
            git push gitee --delete hyperos3-1.9.1 2>/dev/null || \
              curl -s -X DELETE \
                "https://gitee.com/api/v5/repos/leowalk0613/LyricFocus/branches/hyperos3-1.9.1?access_token=${{ secrets.GITEE_TOKEN }}" \
                >/dev/null || true
          fi

  mirror-release:
    needs: mirror-repo
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Resolve release tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          elif [ -n "${{ github.event.inputs.release_tag }}" ]; then
            VERSION="${{ github.event.inputs.release_tag }}"
          else
            VERSION=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases/latest" | jq -r '.tag_name')
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Resolved VERSION=$VERSION"

      - name: Get release info
        run: |
          RELEASE_JSON=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${VERSION}")
          BODY=$(echo "$RELEASE_JSON" | jq -r '.body // ""')
          NAME=$(echo "$RELEASE_JSON" | jq -r '.name // .tag_name')
          TARGET=$(echo "$RELEASE_JSON" | jq -r '.target_commitish // "main"')
          APK_COUNT=$(echo "$RELEASE_JSON" | jq '[.assets[] | select(.name | test("\\.apk$"; "i"))] | length')
          if [ -z "$APK_COUNT" ] || [ "$APK_COUNT" = "0" ]; then
            echo "No APK asset for $VERSION" >&2
            echo "$RELEASE_JSON" | jq -r '.assets[].name // empty' >&2
            exit 1
          fi
          echo "$RELEASE_JSON" | jq -r '[.assets[] | select(.name | test("\\.apk$"; "i"))] | .[] | "\(.name)\t\(.browser_download_url)"' \
            > apk-assets.tsv
          echo "NAME=$NAME" >> $GITHUB_ENV
          echo "TARGET=$TARGET" >> $GITHUB_ENV
          echo "BODY<<EOF" >> $GITHUB_ENV
          echo "$BODY" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          echo "Release: $NAME ($VERSION), target=$TARGET, APKs:"
          cat apk-assets.tsv

      - name: Download APKs
        run: |
          mkdir -p apk-assets
          while IFS=$'\t' read -r NAME URL; do
            echo "Downloading $NAME"
            curl -L -o "apk-assets/$NAME" "$URL"
          done < apk-assets.tsv

      - name: Ensure Gitee release
        run: |
          : > existing-assets.txt
          EXISTING=$(curl -s "https://gitee.com/api/v5/repos/leowalk0613/LyricFocus/releases/tags/$VERSION?access_token=${{ secrets.GITEE_TOKEN }}")
          RELEASE_ID=$(echo "$EXISTING" | jq -r '.id // empty')
          if [ -n "$RELEASE_ID" ]; then
            echo "Reusing Gitee release $RELEASE_ID"
            echo "$EXISTING" | jq -r '.assets[]?.name // empty' >> existing-assets.txt
            curl -s -X PATCH "https://gitee.com/api/v5/repos/leowalk0613/LyricFocus/releases/$RELEASE_ID" \
              -H "Content-Type: application/json" \
              -d "{\"access_token\":\"${{ secrets.GITEE_TOKEN }}\",\"name\":\"$NAME\",\"body\":$(echo "$BODY" | jq -Rs .),\"tag_name\":\"$VERSION\"}" \
              >/dev/null || true
          else
            RESPONSE=$(curl -s -X POST "https://gitee.com/api/v5/repos/leowalk0613/LyricFocus/releases" \
              -H "Content-Type: application/json" \
              -d "{\"access_token\":\"${{ secrets.GITEE_TOKEN }}\",\"tag_name\":\"$VERSION\",\"name\":\"$NAME\",\"body\":$(echo "$BODY" | jq -Rs .),\"target_commitish\":\"$TARGET\",\"prerelease\":false}")
            echo "$RESPONSE" | jq -r '.message // empty' || true
            RELEASE_ID=$(echo "$RESPONSE" | jq -r '.id')
            if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
              echo "Failed to create Gitee release: $RESPONSE" >&2
              exit 1
            fi
            echo "Created release $RELEASE_ID"
          fi
          echo "RELEASE_ID=$RELEASE_ID" >> $GITHUB_ENV
          echo "Already attached:"
          cat existing-assets.txt || true

      - name: Upload APKs to Gitee
        run: |
          FAIL=0
          for f in apk-assets/*.apk; do
            BASE=$(basename "$f")
            if grep -qxF "$BASE" existing-assets.txt 2>/dev/null; then
              echo "Skip existing $BASE"
              continue
            fi
            echo "Uploading $BASE ($(wc -c < "$f") bytes)"
            OK=0
            for attempt in 1 2 3; do
              set +e
              HTTP=$(curl -sS -o /tmp/upload-out.json -w "%{http_code}" \
                --connect-timeout 30 --max-time 600 --retry 2 --retry-delay 10 \
                -X POST "https://gitee.com/api/v5/repos/leowalk0613/LyricFocus/releases/$RELEASE_ID/attach_files" \
                -F "access_token=${{ secrets.GITEE_TOKEN }}" \
                -F "file=@${f}")
              CURL_RC=$?
              set -e
              echo "attempt=$attempt curl_rc=$CURL_RC http=$HTTP"
              cat /tmp/upload-out.json 2>/dev/null || true
              echo
              if [ "$CURL_RC" = "0" ] && { [ "$HTTP" = "200" ] || [ "$HTTP" = "201" ]; }; then
                OK=1
                break
              fi
              sleep 20
            done
            if [ "$OK" != "1" ]; then
              echo "Failed to upload $BASE" >&2
              FAIL=1
            fi
          done
          # 最终核对：两边 APK 都应在 Gitee release 上
          FINAL=$(curl -s "https://gitee.com/api/v5/repos/leowalk0613/LyricFocus/releases/$RELEASE_ID?access_token=${{ secrets.GITEE_TOKEN }}")
          echo "$FINAL" | jq -r '.assets[]?.name // empty'
          for f in apk-assets/*.apk; do
            BASE=$(basename "$f")
            if ! echo "$FINAL" | jq -e --arg n "$BASE" '[.assets[]?.name] | index($n) != null' >/dev/null; then
              echo "Missing on Gitee after upload: $BASE" >&2
              FAIL=1
            fi
          done
          [ "$FAIL" = "0" ]
          echo "Upload done"
