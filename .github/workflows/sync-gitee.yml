name: Sync Repo to Gitee

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "要同步到 Gitee 的 GitHub Release 标签（空则同步 Latest，如 v1.9.2-OS4）"
        required: false
        default: ""
      push_os3_branch:
        description: "是否同时推送 hyperos3-1.9.1 分支到 Gitee"
        required: false
        default: "true"

jobs:
  mirror-repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Fetch all branches and tags
        run: |
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --tags --force
      - name: Push main + tags (+ optional OS3 branch) to Gitee
        run: |
          git remote add gitee "https://leowalk0613:${{ secrets.GITEE_TOKEN }}@gitee.com/leowalk0613/LyricFocus.git"
          git push gitee HEAD:main --force

          # Gitee 常拒绝 tags --force（reference already exists）；先 API 删冲突标签再推
          for tag in $(git tag -l); do
            curl -s -X DELETE \
              "https://gitee.com/api/v5/repos/leowalk0613/LyricFocus/tags/${tag}?access_token=${{ secrets.GITEE_TOKEN }}" \
              >/dev/null || true
          done
          git push gitee --tags --force

          if [ "${{ github.event.inputs.push_os3_branch || 'true' }}" = "true" ]; then
            if git rev-parse --verify origin/hyperos3-1.9.1 >/dev/null 2>&1; then
              git push gitee origin/hyperos3-1.9.1:refs/heads/hyperos3-1.9.1 --force
              echo "Pushed hyperos3-1.9.1"
            else
              echo "origin/hyperos3-1.9.1 not found, skip"
            fi
          fi

  mirror-release:
    needs: mirror-repo
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Resolve release tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          elif [ -n "${{ github.event.inputs.release_tag }}" ]; then
            VERSION="${{ github.event.inputs.release_tag }}"
          else
            VERSION=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases/latest" | jq -r '.tag_name')
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Resolved VERSION=$VERSION"

      - name: Get release info
        run: |
          RELEASE_JSON=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${VERSION}")
          ASSET_URL=$(echo "$RELEASE_JSON" | jq -r '[.assets[] | select(.name | test("\\.apk$"; "i"))][0].browser_download_url')
          BODY=$(echo "$RELEASE_JSON" | jq -r '.body // ""')
          NAME=$(echo "$RELEASE_JSON" | jq -r '.name // .tag_name')
          TARGET=$(echo "$RELEASE_JSON" | jq -r '.target_commitish // "main"')
          if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
            echo "No APK asset for $VERSION" >&2
            echo "$RELEASE_JSON" | jq -r '.assets[].name // empty' >&2
            exit 1
          fi
          echo "ASSET_URL=$ASSET_URL" >> $GITHUB_ENV
          echo "NAME=$NAME" >> $GITHUB_ENV
          echo "TARGET=$TARGET" >> $GITHUB_ENV
          echo "BODY<<EOF" >> $GITHUB_ENV
          echo "$BODY" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          echo "Release: $NAME ($VERSION), target=$TARGET, APK: $ASSET_URL"

      - name: Download APK
        run: curl -L -o LyricFocus.apk "$ASSET_URL"

      - name: Delete existing Gitee release
        run: |
          EXISTING=$(curl -s "https://gitee.com/api/v5/repos/leowalk0613/LyricFocus/releases/tags/$VERSION?access_token=${{ secrets.GITEE_TOKEN }}")
          EXISTING_ID=$(echo "$EXISTING" | jq -r '.id // empty')
          if [ -n "$EXISTING_ID" ]; then
            echo "Deleting existing release $EXISTING_ID"
            curl -s -X DELETE "https://gitee.com/api/v5/repos/leowalk0613/LyricFocus/releases/$EXISTING_ID?access_token=${{ secrets.GITEE_TOKEN }}"
          fi

      - name: Create Gitee release
        run: |
          RESPONSE=$(curl -s -X POST "https://gitee.com/api/v5/repos/leowalk0613/LyricFocus/releases" \
            -H "Content-Type: application/json" \
            -d "{\"access_token\":\"${{ secrets.GITEE_TOKEN }}\",\"tag_name\":\"$VERSION\",\"name\":\"$NAME\",\"body\":$(echo "$BODY" | jq -Rs .),\"target_commitish\":\"$TARGET\",\"prerelease\":false}")
          echo "$RESPONSE" | jq -r '.message // empty' || true
          RELEASE_ID=$(echo "$RESPONSE" | jq -r '.id')
          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
            echo "Failed to create Gitee release: $RESPONSE" >&2
            exit 1
          fi
          echo "RELEASE_ID=$RELEASE_ID" >> $GITHUB_ENV
          echo "Created release $RELEASE_ID"

      - name: Upload APK to Gitee
        run: |
          curl -s -X POST "https://gitee.com/api/v5/repos/leowalk0613/LyricFocus/releases/$RELEASE_ID/attach_files" \
            -F "access_token=${{ secrets.GITEE_TOKEN }}" \
            -F "file=@LyricFocus.apk"
          echo "Upload done"
