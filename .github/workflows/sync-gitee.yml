name: Sync Release to Gitee

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  sync-to-gitee:
    runs-on: ubuntu-latest
    steps:
      - name: Download release APK
        run: |
          ASSET_URL=$(jq -r '.release.assets[] | select(.name | endswith(".apk")) | .browser_download_url' $GITHUB_EVENT_PATH)
          curl -L -o LyricFocus.apk "$ASSET_URL"

      - name: Get release info
        run: |
          echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          echo "TITLE=$(jq -r '.release.name' $GITHUB_EVENT_PATH)" >> $GITHUB_ENV
          echo "BODY=$(jq -r '.release.body' $GITHUB_EVENT_PATH)" >> $GITHUB_ENV

      - name: Create Gitee release
        run: |
          RESPONSE=$(curl -s -X POST "https://gitee.com/api/v5/repos/leowalk0613/LyricFocus/releases" \
            -H "Content-Type: application/json" \
            -d "{
              \"access_token\": \"${{ secrets.GITEE_TOKEN }}\",
              \"tag_name\": \"$VERSION\",
              \"name\": \"$VERSION\",
              \"body\": \"$TITLE\n\n$BODY\"
            }")
          RELEASE_ID=$(echo "$RESPONSE" | jq -r '.id')
          echo "RELEASE_ID=$RELEASE_ID" >> $GITHUB_ENV

      - name: Upload APK to Gitee
        run: |
          curl -s -X POST "https://gitee.com/api/v5/repos/leowalk0613/LyricFocus/releases/$RELEASE_ID/attach_files" \
            -F "access_token=${{ secrets.GITEE_TOKEN }}" \
            -F "file=@LyricFocus.apk"
